services:
  opencode:
    image: opencode-stack/workstation:${OPENCODE_VERSION:?Set OPENCODE_VERSION in .env}
    build:
      context: .
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION}
        HOST_UID: ${HOST_UID:?Run setup.sh to set HOST_UID}
        HOST_GID: ${HOST_GID:?Run setup.sh to set HOST_GID}
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    user: "${HOST_UID:?Run setup.sh to set HOST_UID}:${HOST_GID:?Run setup.sh to set HOST_GID}"
    working_dir: ${WORKSPACE_DIR:?Set WORKSPACE_DIR in .env}
    environment:
      HOME: /home/opencode
      OPENCODE_CONFIG: /etc/opencode-stack/opencode.json
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Set OPENCODE_SERVER_PASSWORD in .env}
      EXA_API_KEY: ${EXA_API_KEY:-}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      GH_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      POSTMAN_API_KEY: ${POSTMAN_API_KEY:-}
    ports:
      - "127.0.0.1:4096:4096"
    volumes:
      - type: bind
        source: ./opencode
        target: /etc/opencode-stack
        read_only: true
      - type: bind
        source: ${WORKSPACE_DIR:?Set WORKSPACE_DIR in .env}
        target: ${WORKSPACE_DIR:?Set WORKSPACE_DIR in .env}
      - type: volume
        source: opencode-data
        target: /home/opencode/.local
      - type: volume
        source: opencode-home
        target: /home/opencode
    # Fresh private temp storage on every start, with the runtime user's owner.
    tmpfs:
      - /tmp/opencode:uid=${HOST_UID},gid=${HOST_GID},mode=0700
    healthcheck:
      test: ["CMD-SHELL", "auth=$$(printf 'opencode:%s' \"$${OPENCODE_SERVER_PASSWORD}\" | base64 | tr -d '\\n'); wget -q -O /dev/null --header=\"Authorization: Basic $$auth\" http://127.0.0.1:4096/global/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  playwright:
    image: mcr.microsoft.com/playwright/mcp:${PLAYWRIGHT_MCP_VERSION:?Set PLAYWRIGHT_MCP_VERSION in .env}@${PLAYWRIGHT_MCP_IMAGE_DIGEST:?Set PLAYWRIGHT_MCP_IMAGE_DIGEST in .env}
    # Share only OpenCode's network namespace, never the host's. Browser and
    # agent now agree on localhost, including servers bound to 127.0.0.1.
    network_mode: service:opencode
    depends_on:
      opencode:
        condition: service_healthy
        restart: true
    command: ["--headless", "--browser", "chromium", "--no-sandbox", "--host", "127.0.0.1", "--port", "8931", "--allowed-hosts", "127.0.0.1:8931,localhost:8931", "--isolated"]
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(8931,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  opencode-data:
  opencode-home:
